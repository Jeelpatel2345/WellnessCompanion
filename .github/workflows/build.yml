name: Build Wellness Companion

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore .\src\WellnessCompanion\WellnessCompanion.csproj

      - name: Build
        run: dotnet build .\src\WellnessCompanion\WellnessCompanion.csproj --configuration Release --no-restore
