name: Publish Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish self-contained application
        run: >
          dotnet publish .\src\WellnessCompanion\WellnessCompanion.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output .\release\WellnessCompanion

      - name: Package release ZIP
        shell: pwsh
        run: |
          Copy-Item README.md .\release\WellnessCompanion\README.md
          Copy-Item LICENSE .\release\WellnessCompanion\LICENSE
          Compress-Archive -Path .\release\WellnessCompanion\* -DestinationPath .\release\WellnessCompanion-win-x64.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: .\release\WellnessCompanion-win-x64.zip
